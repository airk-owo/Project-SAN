# CI: typecheck ทุก workspace + เทสต์ engine + เทสต์ gateway + สแกนความปลอดภัย ทุกครั้งที่ push/PR
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (web + server + game)
        run: npm run check
      - name: Engine tests
        run: npm test -w @wtk/game
      - name: Gateway tests
        run: npm test -w @wtk/server

  # รากฐาน security: secret scan ทั้ง history + fail เมื่อ dependency มีช่องโหว่ high/critical
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks สแกน git history ทั้งหมด ไม่ใช่แค่ commit ล่าสุด
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
